<style>
/* Layout: one phone-width column that widens into a card grid on desktop. Palette is David's 208 Pressbox design; headings, tabs and scores are set in chalk lettering. */
:root{
  color-scheme:dark;
  --bg:#0E1116; --card:#171C24; --line:#2A313C; --dash:#4A5361;
  --fg:#F2F4F7; --muted:#A9B1BD; --accent:#FFB81C; --on-accent:#111;
  --good:#6FD6A4; --bad:#FF9A8C;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --chalk:#F4F1E8;
  --disp:'Cabin Sketch','Chalkboard SE','Comic Sans MS','Arial Narrow',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.35}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 0 10px}
.brand{display:flex;align-items:baseline;gap:6px;color:var(--fg);font-family:var(--disp);font-weight:700;font-size:34px;letter-spacing:.5px;line-height:1;background:none;border:0;padding:0;min-height:44px;color:var(--chalk);white-space:nowrap}
.brand b{color:var(--accent);font-weight:700}
.brand img{width:40px;height:40px;border-radius:10px;align-self:center;margin-right:4px}
@media(max-width:440px){.brand{font-size:26px}.brand img{width:36px;height:36px}.hdr-btns{gap:6px}}
.brand span,.brand b{filter:url(#chalkfx)}
.score,.pill,.hero h1{color:var(--chalk)}
.trow.lose .score{color:var(--muted)}
.hdr-btns{display:flex;gap:8px}
.icon{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;flex:none}
.eyebrow{margin:0;font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;min-height:44px;padding:0 4px}
.sec{display:flex;flex-direction:column;gap:12px;padding:16px 0}
.myteams{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.mt{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;flex:none;background:none;border:0;padding:0;font-size:12px;font-weight:500;text-align:center;line-height:1.2}
.logo{border-radius:50%;background:#fff;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center}
.logo img{width:80%;height:80%;object-fit:contain}
.logo.x{background:var(--line);color:var(--muted);font-family:var(--disp);font-weight:700}
.add-ring{width:60px;height:60px;border-radius:30px;border:2px dashed var(--dash);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(max-content,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{height:52px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;padding:0 10px}
.tab[aria-current=page]{color:var(--chalk);border-bottom-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.chip{height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500;white-space:nowrap;flex:none}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.note{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;min-width:0}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;letter-spacing:.8px;color:var(--muted);text-transform:uppercase}
.meta .up{color:var(--accent)}
.trow{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;min-width:0}
.trow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow.lose{color:var(--muted);font-weight:500}
.score{font-family:var(--disp);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.spon{border-top:1px dashed var(--line);padding-top:8px;font-size:12.5px;color:var(--muted)}

.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px 8px}
.tg{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:4px 0;font-size:13px;font-weight:500;text-align:center}
.tg small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-family:var(--disp);font-size:13px;letter-spacing:1px;color:var(--muted);text-align:right;padding:10px 12px;font-weight:700;text-transform:uppercase}
td{padding:6px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td .tbtn{background:none;border:0;padding:0;display:flex;align-items:center;gap:10px;min-height:40px;font-weight:600}
tr.me td{background:rgba(255,184,28,.08)}
.hero{display:flex;align-items:center;gap:14px;padding:8px 0 4px}
.hero h1{margin:0;font-family:var(--disp);font-weight:700;font-size:34px;line-height:1;letter-spacing:.5px;text-transform:uppercase;text-wrap:balance}
.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}
.btn{height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--fg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{height:36px;padding:0 12px;font-size:13px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);min-height:52px;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .sub{color:var(--muted);font-size:13px}
.num{font-family:var(--disp);font-weight:700;font-size:20px;width:44px;flex:none;color:var(--accent);font-variant-numeric:tabular-nums}
.pill{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.w{color:var(--good)} .pill.l{color:var(--bad)} .pill.u{color:var(--accent)}
.eyebrow{font-size:19px;letter-spacing:1px;color:var(--chalk);opacity:.8}
.pill{font-size:19px}
.tab{font-size:18px}
.score{font-size:32px}
.num{font-size:22px}
.slot{border:2px dashed var(--dash);border-radius:12px;padding:16px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.slot strong{color:var(--fg);font-family:var(--disp);font-size:18px;letter-spacing:.5px;text-transform:uppercase}
.back{background:none;border:0;color:var(--muted);font-weight:600;min-height:44px;padding:0;display:flex;align-items:center;gap:6px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:88%;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media(min-width:640px){.scrim{align-items:center}.sheet{border-radius:16px}}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.field input,.field select,.field textarea,.in{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--fg);min-height:44px;width:100%}
.field textarea{min-height:180px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.in.sc{width:60px;text-align:center;font-family:var(--disp);font-weight:700;font-size:20px;padding:6px}
.formrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.banner{border:1px solid var(--accent);border-radius:12px;padding:10px 14px;font-size:13.5px;background:rgba(255,184,28,.08)}
.flag{border-left:0}
.tag{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:2px 8px;white-space:nowrap}
@media(prefers-reduced-motion:no-preference){.chip,.btn,.tab{transition:background .15s,color .15s,border-color .15s}}

.meta .live,.meta .no{color:var(--bad)} .meta .ok{color:var(--good)}
.pkb{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:none;font-size:16px;font-weight:600;text-align:left}
.pkb .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkb[aria-pressed=true]{border-color:var(--accent);background:rgba(255,184,28,.14)}
.pkb:disabled{cursor:default;opacity:.85}
.bar{flex-basis:100%;height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.ph{padding:0;border:0;background:var(--card);aspect-ratio:1;border-radius:8px;overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.sheet>*{flex-shrink:0}
.gd{width:70px;flex:none;display:flex;flex-direction:column;gap:2px;font-size:11.5px;letter-spacing:.6px;color:var(--muted)}.gd b{color:var(--fg);font-size:12.5px}
.gr{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;min-height:28px}.gr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr b{font-family:var(--disp);font-size:20px;color:var(--chalk)}.gr.lose{color:var(--muted);font-weight:500}.gr.lose b{color:var(--muted)}
[data-look=board] .gr{font-weight:400;font-size:17px}[data-look=board] .gr:not(.lose) b,[data-look=score] .gr:not(.lose) b{color:var(--accent)}
.bk{display:grid;gap:13px;align-items:stretch}
.br{display:flex;flex-direction:column;min-width:0}
.bh{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc,.bp{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:8px;position:relative}
.bp::after{content:'';position:absolute;right:-8px;top:25%;bottom:25%;width:7px;border:2px solid var(--dash);border-left:0}
.bm{border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--card);min-width:0;position:relative}
.bc.fed .bm::before{content:'';position:absolute;left:-7px;top:50%;width:6px;border-top:2px solid var(--dash)}
.bs{display:flex;gap:4px;align-items:center;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:15px;font-weight:600;min-height:24px}.bs .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bs i{font-style:normal;font-size:10.5px;color:var(--muted);width:11px;flex:none}.bs b{font-family:var(--disp);font-size:16px;color:var(--chalk)}.bs.lose{color:var(--muted);font-weight:500}.bs.lose b{color:var(--muted)}
.bd{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-look=board] .bm{border-width:2px;border-color:var(--fg);border-radius:0}[data-look=board] .bs:not(.lose) b{color:var(--accent)}[data-look=score] .bm{border-radius:0}[data-look=score] .bs:not(.lose) b{color:var(--accent)}
.chips.scroll{flex-wrap:wrap;overflow:visible;padding-bottom:0}
.tabs.fit{grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible;border-bottom:0}
.tabs.fit .tab{border:0;border-bottom:1px solid var(--line);padding:0 4px;font-size:15px;height:46px;white-space:normal}
.tabs.fit .tab[aria-current=page]{border-bottom:3px solid var(--accent)}
.wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;max-width:1040px;margin:0 auto;padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.bb{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;font-size:12px;font-weight:600;min-height:52px;padding:2px 0}
.bb[aria-current=page]{color:var(--accent)}
.wks{display:grid;gap:4px}
.wk{height:44px;padding:0;border:1px solid var(--line);background:var(--card);font-family:var(--disp);font-weight:700;font-size:17px;border-radius:8px;color:var(--fg)}
.wk.past{color:var(--muted)}.wk[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg .chip{padding:0 6px;text-align:center}
.chip:disabled{opacity:.4;cursor:default}.chip.wkc{height:40px;padding:0 10px;font-size:13.5px}
[data-look=score] .bbar{border-top:2px solid var(--fg)}[data-look=score] .bb{font-size:11px;letter-spacing:0;text-transform:uppercase}[data-look=score] .wk{border-radius:0;font-weight:400}
[data-look=board] .bbar{background:#18221F;border-top:2px solid var(--fg);left:10px;right:10px;bottom:10px;max-width:1020px;font-size:14px}[data-look=board] .bb{font-size:13px;font-weight:400}
[data-look=board] .wk{border-radius:0;border-width:2px;background:none}[data-look=board] .wk:not(.past){border-color:var(--fg)}[data-look=board] .wk[aria-pressed=true]{border-color:var(--accent);background:var(--accent);color:#1F2B27}
[data-look=board] .wrap{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.big{font-family:var(--disp);font-weight:700;font-size:40px;line-height:1;color:var(--chalk)}
.btn:disabled{opacity:.5;cursor:default}
input[type=file]{padding:8px}
/* Look A: scoreboard. Black and gold, block numbers, square corners. */
[data-look=score]{--bg:#0A0A0B;--card:#0A0A0B;--line:#33312D;--dash:#5A574F;--fg:#F5F2E9;--muted:#9A968C;--chalk:#F5F2E9;--disp:Anton,'Arial Narrow',sans-serif;--body:'Barlow Condensed','Arial Narrow',sans-serif}
[data-look=score] body{font-size:17px;letter-spacing:.2px}
[data-look=score] .brand span,[data-look=score] .brand b{filter:none}
[data-look=score] .hdr{background:var(--accent);margin:0 -16px;padding:10px 16px}
[data-look=score] .brand,[data-look=score] .brand b{color:#0A0A0B;font-weight:400}
[data-look=score] .hdr .icon{background:none;border:2px solid #0A0A0B;color:#0A0A0B}
[data-look=score] .card,[data-look=score] .btn,[data-look=score] .chip,[data-look=score] .icon,[data-look=score] .list,[data-look=score] .tablebox,[data-look=score] .slot,[data-look=score] .banner,[data-look=score] .sheet,[data-look=score] .in,[data-look=score] .field input,[data-look=score] .field select,[data-look=score] .field textarea,[data-look=score] .logo,[data-look=score] .pkb,[data-look=score] .ph,[data-look=score] .tag,[data-look=score] .bar,[data-look=score] .brand img,[data-look=score] .toast{border-radius:0}
[data-look=score] .score,[data-look=score] .num,[data-look=score] .hero h1,[data-look=score] .big{font-weight:400}
[data-look=score] .score{font-size:44px}[data-look=score] .trow:not(.lose) .score{color:var(--accent)}
[data-look=score] .trow .nm{text-transform:uppercase;font-size:22px;font-weight:700;letter-spacing:.5px}[data-look=score] .trow.lose .nm{font-weight:600}
[data-look=score] .tab,[data-look=score] .eyebrow,[data-look=score] th,[data-look=score] .pill,[data-look=score] .slot strong{font-family:var(--body);font-weight:700;letter-spacing:1.5px}
[data-look=score] .tabs{border-top:0;border-bottom:2px solid var(--fg)}

[data-look=score] .meta{font-size:14px;letter-spacing:1.5px}[data-look=score] .meta span:last-child{background:var(--fg);color:var(--bg);padding:1px 8px}[data-look=score] .meta .up{background:var(--accent)}[data-look=score] .meta .live{background:var(--bad)}
[data-look=score] .chip[aria-pressed=true]{color:#0A0A0B}[data-look=score] .chip,[data-look=score] .btn{font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.8px}
/* Look C: coach's chalkboard. Slate board in a wood frame, hand-drawn boxes, handwriting. */
[data-look=board]{--bg:#1F2B27;--card:transparent;--line:#7C8A84;--dash:#7C8A84;--fg:#EEF0E8;--muted:#A9B5AF;--accent:#F2D15C;--chalk:#EEF0E8;--body:'Patrick Hand','Chalkboard SE',cursive}
[data-look=board] body{background:#6B4A2B;font-size:18px}
[data-look=board] .wrap{background:var(--bg);margin:10px auto;min-height:calc(100vh - 20px);max-width:1020px}
@media(max-width:1060px){[data-look=board] .wrap{margin:10px}}
[data-look=board] .card,[data-look=board] .list,[data-look=board] .tablebox,[data-look=board] .slot,[data-look=board] .banner,[data-look=board] .pkb,[data-look=board] .icon,[data-look=board] .chip,[data-look=board] .btn{border-radius:255px 15px 225px 15px/15px 225px 15px 255px;border-width:2px}
[data-look=board] .card:nth-child(even),[data-look=board] .chip:nth-child(even){border-radius:15px 225px 15px 255px/255px 15px 225px 15px}
[data-look=board] .card,[data-look=board] .list,[data-look=board] .tablebox{border-color:var(--fg)}
[data-look=board] .tabs{border-top:0;border-bottom:2px dashed var(--line)}
[data-look=board] .tab[aria-current=page]{color:var(--accent);border-bottom-color:transparent;text-decoration:underline wavy;text-underline-offset:6px}

<script>

/* ---------- Shared database ----------
   One small interface with two engines behind it. With a Firebase config the app talks to Firestore, so every phone
   sees the same thing. Without one it keeps everything in this browser (the old behavior, and what the preview uses).
   Collections: state/admin (the owner's edits), state/live (scores from trusted sources), reports, applications,
   trusted, picks, boards, votes, photos + photoFull, flags, visits, stats. */
const deepMerge=(a,b)=>{const o={...a};Object.keys(b).forEach(k=>{o[k]=b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a&&a[k]&&typeof a[k]==='object'?deepMerge(a[k],b[k]):b[k]});return o};
const deepAdd=(a,b)=>{const o={...(a||{})};Object.keys(b).forEach(k=>{o[k]=typeof b[k]==='number'?(o[k]||0)+b[k]:deepAdd(o[k],b[k])});return o};
const newId=()=>String(1e13-Date.now()).padStart(13,'0')+Math.random().toString(36).slice(2,6); // sorts newest first
function localDB(){
  const K='pb_db1',VOLATILE=['photos','photoFull'];let mem=ls.json(K)||{};
  const save=()=>{const o={};Object.keys(mem).forEach(c=>{if(!VOLATILE.includes(c))o[c]=mem[c]});ls.set(K,JSON.stringify(o))};
  let uid=ls.get('pb_uid');if(!uid){uid='u'+Math.random().toString(36).slice(2,12);ls.set('pb_uid',uid)}
  const col=c=>mem[c]=mem[c]||{},subs=[];
  const ok=(d,w)=>(w||[]).every(([f,op,v])=>op==='=='?d[f]===v:true);
  const me={uid,admin:true,trusted:!!col('trusted')[uid],email:''};
  return{kind:'local',me,stamp:()=>Date.now(),
    get:async(c,id)=>col(c)[id]?{id,...clone(col(c)[id])}:null,
    set:async(c,id,d,merge)=>{col(c)[id]=merge?deepMerge(col(c)[id]||{},d):d;if(c==='trusted')me.trusted=!!col(c)[uid];save();subs.forEach(x=>x[0]===c&&x[1]===id&&x[2]())},
    add:async(c,d)=>{const id=newId();col(c)[id]=d;save();return id},
    del:async(c,id)=>{delete col(c)[id];if(c==='trusted')me.trusted=!!col(c)[uid];save()},
    list:async(c,w,o)=>{let r=Object.keys(col(c)).sort().map(id=>({id,...clone(col(c)[id])})).filter(d=>ok(d,w));return o&&o.limit?r.slice(0,o.limit):r},
    count:async(c,w)=>Object.values(col(c)).filter(d=>ok(d,w)).length,
    inc:async(c,id,d)=>{col(c)[id]=deepAdd(col(c)[id],d);save()},
    watch:(c,id,cb)=>{const f=()=>cb(col(c)[id]?clone(col(c)[id]):null),x=[c,id,f];subs.push(x);f();return()=>{subs.splice(subs.indexOf(x),1)}},
    signIn:async()=>{},signOut:async()=>{}};
}
async function fireDB(cfg){
  const B='https://www.gstatic.com/firebasejs/10.14.1/firebase-';
  const[A,U,F]=await Promise.all([import(B+'app.js'),import(B+'auth.js'),import(B+'firestore.js')]);
  const app=A.initializeApp(cfg),auth=U.getAuth(app),db=F.getFirestore(app);
  const norm=v=>v&&typeof v.toMillis==='function'?v.toMillis():Array.isArray(v)?v.map(norm):v&&typeof v==='object'?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,norm(x)])):v;
  const row=s=>({id:s.id,...norm(s.data())});
  const q=(c,w,o)=>{const p=(w||[]).map(([f,op,v])=>F.where(f,op,v));if(o&&o.limit)p.push(F.limit(o.limit));return F.query(F.collection(db,c),...p)};
  const incs=d=>Object.fromEntries(Object.entries(d).map(([k,v])=>[k,typeof v==='number'?F.increment(v):incs(v)]));
  const me={uid:null,admin:false,trusted:false,email:''};
  const who=async u=>{me.uid=u.uid;me.email=u.email||'';me.admin=false;me.trusted=false;
    if(u.email){try{await F.getDoc(F.doc(db,'adminCheck','x'));me.admin=true}catch(e){}}   // only the owner's account may read this
    try{me.trusted=(await F.getDoc(F.doc(db,'trusted',u.uid))).exists()}catch(e){}};
  await new Promise((res,rej)=>{const off=U.onAuthStateChanged(auth,async u=>{off();try{if(!u)u=(await U.signInAnonymously(auth)).user;await who(u);res()}catch(e){rej(e)}})});
  return{kind:'fire',me,stamp:()=>F.serverTimestamp(),
    get:async(c,id)=>{const s=await F.getDoc(F.doc(db,c,id));return s.exists()?row(s):null},
    set:(c,id,d,merge)=>F.setDoc(F.doc(db,c,id),d,{merge:!!merge}),
    add:async(c,d)=>{const id=newId();await F.setDoc(F.doc(db,c,id),d);return id},
    del:(c,id)=>F.deleteDoc(F.doc(db,c,id)),
    list:async(c,w,o)=>(await F.getDocs(q(c,w,o))).docs.map(row),
    count:async(c,w)=>(await F.getCountFromServer(q(c,w))).data().count,
    inc:(c,id,d)=>F.setDoc(F.doc(db,c,id),incs(d),{merge:true}),
    watch:(c,id,cb)=>F.onSnapshot(F.doc(db,c,id),s=>cb(s.exists()?norm(s.data()):null),()=>{}),
    signIn:async()=>{const r=await U.signInWithPopup(auth,new U.GoogleAuthProvider());await who(r.user)},
    signOut:async()=>{await U.signOut(auth);await who((await U.signInAnonymously(auth)).user)}};
}
let DB=localDB();
const dbReady=FB?fireDB(FB).then(d=>{DB=d;return d}).catch(e=>{console.warn('Shared database unavailable, using this device only',e);return DB}):Promise.resolve(DB);

/* The owner's edits are stored as a small list of differences from the published data, not a copy of it,
   so a score update from MaxPreps never wipes them out. */
function applyPatch(seed,p,live){
  const S=clone(seed);p=p||{};S.brackets=S.brackets||[];
  S.games.forEach(g=>{const sc=(p.scores||{})[g.id],sp=(p.sponsors||{})[g.id],lv=(live||{})[g.id];
    if(lv&&g.hs==null&&!sc&&(/^Final/.test(lv.st)||Date.now()-lv.at<6*3600e3)){g.as=lv.as;g.hs=lv.hs;g.live=lv;if(!/^Final/.test(lv.st))g.inprog=true;else if(/OT/.test(lv.st))g.note='OT'}
    if(sc){g.as=sc[0]??null;g.hs=sc[1]??null}
    if(sp){g.sponsorMode=sp.mode;g.sponsors=sp.list||[]}});
  if(p.businesses)S.businesses=p.businesses;
  S.teams.forEach(t=>{const e=(p.teams||{})[t.id];if(e)Object.assign(t,e);t.favBiz=(p.favBiz||{})[t.id]||[];
    Object.keys(p.rosters||{}).forEach(k=>{const[tid,sp,lv]=k.split('|');if(tid===t.id){t.rosters[sp]=t.rosters[sp]||{};t.rosters[sp][lv]=p.rosters[k]}})});
  Object.keys(p.stats||{}).forEach(k=>{const[tid,sp]=k.split('|'),t=S.teams.find(x=>x.id===tid);if(t){t.stats=t.stats||{};t.stats[sp]=p.stats[k]}});
  S.flags=S.flags.filter(f=>!(p.flagsDone||[]).includes(f));
  S.polls=p.polls||[];S.recaps=p.recaps||{};S.look=p.look||'board';
  return S;
}
function derivePatch(S){
  const J=JSON.stringify,sg={},st={};SEED.games.forEach(g=>sg[g.id]=g);SEED.teams.forEach(t=>st[t.id]=t);
  const p={scores:{},sponsors:{},rosters:{},stats:{},teams:{},favBiz:{},businesses:S.businesses||[],flagsDone:SEED.flags.filter(f=>!S.flags.includes(f)),polls:S.polls||[],recaps:S.recaps||{},look:S.look||'board'};
  S.games.forEach(g=>{const o=sg[g.id];if(!o)return;if(g.hs!==o.hs||g.as!==o.as)p.scores[g.id]=[g.as??null,g.hs??null];if(g.sponsors.length)p.sponsors[g.id]={mode:g.sponsorMode,list:g.sponsors}});
  S.teams.forEach(t=>{const o=st[t.id];if(!o)return;if(t.favBiz.length)p.favBiz[t.id]=t.favBiz;
    if(t.name!==o.name||t.mascot!==o.mascot||J(t.links)!==J(o.links))p.teams[t.id]={name:t.name,mascot:t.mascot,links:t.links};
    Object.keys(t.rosters).forEach(sp=>Object.keys(t.rosters[sp]).forEach(lv=>{if(J(t.rosters[sp][lv])!==J((o.rosters[sp]||{})[lv]||[]))p.rosters[t.id+'|'+sp+'|'+lv]=t.rosters[sp][lv]}));
    Object.keys(t.stats||{}).forEach(sp=>{if(J(t.stats[sp])!==J((o.stats||{})[sp]||{}))p.stats[t.id+'|'+sp]=t.stats[sp]})});
  return clone(p);
}
let SAY=()=>{},PICKED=()=>{};   // SAY: small pop-up message. PICKED: tells the app about a new pick so schedules can show it.   // small pop-up message, set by App

const pend={},seen=new Set();let pendT;
function track(a,b,once){if(!COMMUNITY||DB.me.admin&&DB.kind==='fire')return;if(once){if(seen.has(a+b))return;seen.add(a+b)}pend[a]=pend[a]||{};pend[a][b]=(pend[a][b]||0)+1;clearTimeout(pendT);pendT=setTimeout(flushTrack,5000)}
function flushTrack(){const d={};Object.keys(pend).forEach(k=>{d[k]=pend[k];delete pend[k]});if(Object.keys(d).length)dbReady.then(()=>DB.inc('stats',todayISO(),d)).catch(()=>{})}
function countVisit(){if(!COMMUNITY)return;const d=todayISO();if(ls.get('pb_visit')===d)return;dbReady.then(()=>{if(DB.me.admin&&DB.kind==='fire')return;return DB.set('visits',d+'__'+DB.me.uid,{day:d,uid:DB.me.uid,home:standalone()}).then(()=>ls.set('pb_visit',d))}).catch(()=>{})}
const standalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
const DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const D=iso=>{const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)};
const dshort=iso=>{const d=D(iso);return DAYS[d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate()};
const fmtDay=s=>{const d=new Date(/T/.test(s)?s:s+'T12:00:00');return isNaN(d)?s:MON[d.getMonth()]+' '+d.getDate()};
const fmtStamp=s=>{const d=new Date(s);if(isNaN(d)||!/T/.test(s||''))return null;let h=d.getHours();const m=String(d.getMinutes()).padStart(2,'0');return MON[d.getMonth()]+' '+d.getDate()+', '+((h%12)||12)+':'+m+' '+(h>=12?'PM':'AM')};
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const weekKey=iso=>{const d=D(iso);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
const played=g=>g.hs!=null&&g.as!=null&&!g.inprog;
const hasScore=g=>g.hs!=null&&g.as!=null;
const kickoff=g=>{const d=D(g.date),m=/^(\d+):(\d+) (AM|PM)$/.exec(g.time||'');if(m)d.setHours(+m[1]%12+(m[3]==='PM'?12:0),+m[2]);return d.getTime()};
const mondayOf=iso=>{const d=D(iso);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const clockOf=ms=>{const d=new Date(ms);return((d.getHours()%12)||12)+':'+String(d.getMinutes()).padStart(2,'0')+' '+(d.getHours()>=12?'PM':'AM')};
const CATS=[['RUSH','Rushing','yds/game'],['REC','Receiving','yds/game'],['TD','Total TDs',''],['PTD','Passing TDs',''],['TKL','Tackles','per game'],['SACK','Sacks',''],['INT','Interceptions','']];

function model(S,sport,level){
  const soccer=/soc$/.test(sport),sp=S.sports.find(x=>x.id===sport)||S.sports[0];
  const G=S.games.filter(g=>(g.sport||'football')===sport&&(g.level||'v')===level);
  const T={};S.teams.forEach(t=>T[t.id]=t);
  const B={};S.businesses.forEach(b=>B[b.id]=b);
  const sideOf=(g,w)=>{const id=g[w];return id?{id,name:T[id].name,score:w=='home'?g.hs:g.as}:{id:null,name:g.outside,score:w=='home'?g.hs:g.as}};
  const isConf=g=>!!g.conf;
  const gamesOf=id=>G.filter(g=>g.home===id||g.away===id);
  const rec=id=>{const r={w:0,l:0,t:0,cw:0,cl:0,ct:0,pf:0,pa:0};gamesOf(id).forEach(g=>{if(!played(g))return;const mine=g.home===id?g.hs:g.as,th=g.home===id?g.as:g.hs;r.pf+=mine;r.pa+=th;const k=mine>th?'w':mine<th?'l':'t';r[k]++;if(g.conf)r['c'+k]++});r.all=r.w+'-'+r.l+(r.t?'-'+r.t:'');r.cf=r.cw+'-'+r.cl+(r.ct?'-'+r.ct:'');r.pts=soccer?3*r.cw+r.ct:r.cw-r.cl;r.apts=soccer?3*r.w+r.t:r.w-r.l;return r};
  const confs={};S.teams.forEach(t=>(confs[t.conf]=confs[t.conf]||[]).push(t));
  const standings=conf=>confs[conf].map(t=>({t,r:rec(t.id)})).sort((a,b)=>b.r.pts-a.r.pts||b.r.cw-a.r.cw||b.r.apts-a.r.apts||b.r.w-a.r.w||a.t.name.localeCompare(b.t.name));
  const weeks=[];G.forEach(g=>{const k=weekKey(g.date);let w=weeks.find(x=>x.k===k);if(!w)weeks.push(w={k,first:g.date,games:[]});w.games.push(g)});
  weeks.forEach((w,i)=>{const d=D(w.first);w.label='Wk '+(i+1)+' · '+MON[d.getMonth()]+' '+d.getDate()});
  const t0=todayISO();let cur=weeks.findIndex(w=>w.games.some(g=>!played(g)&&g.date>=t0));if(cur<0)cur=weeks.length-1;
  const recAt=(id,date)=>{let w=0,l=0,t=0,run=0;gamesOf(id).forEach(g=>{if(!played(g)||g.date>date)return;const mine=g.home===id?g.hs:g.as,th=g.home===id?g.as:g.hs;if(mine>th){w++;run=run>0?run+1:1}else if(mine<th){l++;run=run<0?run-1:-1}else{t++;run=0}});return{all:w+'-'+l+(t?'-'+t:''),run}};
  return{S,G,sport,soccer,fb:sport==='football',vb:sport==='vb',sp,level,T,B,sideOf,isConf,gamesOf,rec,recAt,confs,standings,weeks,cur};
}
const NOTE={FF:'FORFEIT',OT:'FINAL/OT'};
// Stat categories for a sport: football keeps its fixed order and labels; other sports use whatever categories have been loaded.
const catsFor=(M,sport)=>{const seen=[];M.S.teams.forEach(t=>Object.keys((t.stats||{})[sport]||{}).forEach(k=>{if(!seen.includes(k))seen.push(k)}));const fb=sport.indexOf('football')===0?CATS.filter(c=>seen.includes(c[0])):[];return fb.concat(seen.filter(k=>!fb.some(c=>c[0]===k)).map(k=>[k,k,'']))};
function teamNumbers(M,id){const gs=M.gamesOf(id).filter(played);if(!gs.length)return null;let pf=0,pa=0,hw=0,hl=0,aw=0,al=0,best=null,run=0;
  gs.forEach(g=>{const home=g.home===id,mine=home?g.hs:g.as,th=home?g.as:g.hs;pf+=mine;pa+=th;if(mine>th){home?hw++:aw++;run=run>0?run+1:1;if(!best||mine-th>best.d)best={d:mine-th,g,mine,th}}else if(mine<th){home?hl++:al++;run=run<0?run-1:-1}else run=0});
  const per=n=>(Math.round(10*n/gs.length)/10).toFixed(1);
  return{n:gs.length,pf:per(pf),pa:per(pa),home:hw+'-'+hl,away:aw+'-'+al,streak:run>0?'Won '+run:run<0?'Lost '+(-run):'None',best};}

function sponsorLine(M,g){
  if(!g.sponsors.length)return null;
  const nm=id=>(M.B[id]||{}).name||'Sponsor';
  if(g.sponsorMode==='winner'){const s=g.sponsors[0],h=M.sideOf(g,'home'),a=M.sideOf(g,'away');
    const amt=s.amt?'$'+s.amt:'The sponsorship';
    if(played(g)&&g.hs!==g.as){const w=g.hs>g.as?h:a;return html`<b>${nm(s.biz)}</b> matchup · ${amt} goes to ${w.name}`}
    return html`<b>${nm(s.biz)}</b> matchup · ${amt} goes to the winner`}
  return g.sponsors.map((s,i)=>html`${i?' · ':''}${M.sideOf(g,s.side).name}: <b>${nm(s.biz)}</b>`);
}

function Logo({id,name,size=32}){
  const st='width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*.4)+'px';
  if(id&&LOGO[id])return html`<span class="logo" style=${st}><img src=${LOGO[id]} alt=""/></span>`;
  return html`<span class="logo x" style=${st} aria-hidden="true">${(name||'?').replace(/[^A-Za-z ]/g,'').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}</span>`;
}

};
function Sports({M,setSport,all,edit}){
  const hid=all?[]:(M.hidden||[]);
  return html`<div class="chips" role="group" aria-label="Sport">${M.S.sports.filter(x=>x.on&&(M.sport===x.id||!hid.includes(x.id))).map(x=>html`<button class="chip" aria-pressed=${M.sport===x.id} onClick=${()=>setSport(x.id)}>${x.name}</button>`)}${edit?html`<button class="chip" style="border-style:dashed;color:var(--muted)" onClick=${edit}>${hid.length?'+ '+hid.length+' hidden':'Edit sports'}</button>`:null}</div>`;
}
function WeekPick({weeks,wk,setWk,cur}){
  const n=weeks.length;if(!n)return null;const mode=wk<cur?'past':wk>cur?'next':'now';
  const list=mode==='past'?weeks.slice(0,cur).map((x,i)=>[x,i]).reverse():mode==='next'?weeks.slice(cur+1).map((x,i)=>[x,cur+1+i]):[];

/* ---------- Recaps: written from the scores only, so nothing is made up ---------- */
const MARGIN={football:[3,8,28],bsoc:[1,1,4],gsoc:[1,1,4]};
function recap(M,g){
  const own=(M.S.recaps||{})[g.id];if(own)return{text:own,auto:false};
  if(!played(g))return null;
  const h=M.sideOf(g,'home'),a=M.sideOf(g,'away');
  if(g.hs===g.as)return{text:a.name+' and '+h.name+' finished tied '+g.as+'-'+g.hs+'.',auto:true};
  const w=g.hs>g.as?h:a,l=w===h?a:h,d=w.score-l.score,m=MARGIN[M.sport]||[3,8,25];
  const verb=g.note==='FF'?'won by forfeit over':M.vb?(l.score===0?'swept':d===1?'outlasted':'beat'):l.score===0&&M.fb?'shut out':d<=m[0]?'edged':d<=m[1]?'held off':d>=m[2]?'rolled past':'beat';
  let t=w.name+' '+verb+' '+l.name+' '+w.score+'-'+l.score+(g.siteUnknown||g.note==='FF'?'':w===a?' on the road':' at home')+(g.note==='OT'?' in overtime':'')+'.';
  if(w.id){const r=M.recAt(w.id,g.date);t+=' '+w.name+' moved to '+r.all+(r.run>=3?' with '+r.run+' wins in a row':'')+'.'}
  if(l.id){const r=M.recAt(l.id,g.date);t+=' '+l.name+' fell to '+r.all+(r.run<=-3?', '+(-r.run)+' losses in a row':'')+'.'}
  [w,l].forEach(s=>{if(!s.id)return;const gs=M.gamesOf(s.id),later=gs.filter(x=>x.date>g.date);if(later.some(played))return;const nx=later[0];if(!nx)return;
    const o=M.sideOf(nx,nx.home===s.id?'away':'home');t+=' Next for '+s.name+': '+nice(nx.date)+(nx.home===s.id?' vs ':' at ')+o.name+'.'});
  return{text:t,auto:true};
}

/* ---------- Share a score as a picture ---------- */
const loadImg=src=>new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src});
async function scoreCard(M,g){
  const W=1080,c=document.createElement('canvas');c.width=c.height=W;const x=c.getContext('2d');
  try{await Promise.all([document.fonts.load('700 120px "Cabin Sketch"'),document.fonts.load('600 60px Barlow')])}catch(e){}
  const disp='"Cabin Sketch","Chalkboard SE",sans-serif',body='Barlow,system-ui,sans-serif';
  x.fillStyle='#0E1116';x.fillRect(0,0,W,W);
  for(let i=0;i<1400;i++){x.fillStyle='rgba(244,241,232,'+(Math.random()*.045).toFixed(3)+')';x.fillRect(Math.random()*W,Math.random()*W,2+Math.random()*26,1+Math.random()*2)}
  x.strokeStyle='#4A5361';x.lineWidth=5;x.strokeRect(36,36,W-72,W-72);
  x.textBaseline='middle';x.textAlign='left';x.font='700 92px '+disp;
  const w1=x.measureText('208 ').width,w2=x.measureText('PRESSBOX').width,x0=(W-w1-w2)/2;
  x.fillStyle='#FFB81C';x.fillText('208 ',x0,150);x.fillStyle='#F4F1E8';x.fillText('PRESSBOX',x0+w1,150);
  const h=M.sideOf(g,'home'),a=M.sideOf(g,'away'),st=status(g),up=!hasScore(g);
  x.textAlign='center';x.fillStyle='#A9B1BD';x.font='600 38px '+body;
  x.fillText(((M.level==='v'?'':LV[M.level]+' ')+M.sp.name+'  ·  '+(up?(g.conf?'Conference game':g.post?'Playoffs':'Game day'):st.t)).toUpperCase(),W/2,250);
  const rows=[a,h];
  for(let i=0;i<2;i++){const s=rows[i],o=rows[1-i],y=430+i*250,lose=!up&&s.score<o.score;
    x.beginPath();x.arc(170,y,92,0,7);x.fillStyle=s.id&&LOGO[s.id]?'#fff':'#2A313C';x.fill();
    const im=s.id&&LOGO[s.id]?await loadImg(LOGO[s.id]):null;
    if(im){const k=Math.min(124/im.width,124/im.height);x.save();x.beginPath();x.arc(170,y,90,0,7);x.clip();x.drawImage(im,170-im.width*k/2,y-im.height*k/2,im.width*k,im.height*k);x.restore()}
    else{x.fillStyle='#A9B1BD';x.font='700 64px '+disp;x.textAlign='center';x.fillText(s.name.replace(/[^A-Za-z ]/g,'').split(' ').map(v=>v[0]).join('').slice(0,2).toUpperCase(),170,y)}
    x.textAlign='left';x.fillStyle=lose?'#A9B1BD':'#F2F4F7';let fs=70;do{x.font=(lose?'500 ':'600 ')+fs+'px '+body;fs-=4}while(x.measureText(s.name).width>500&&fs>30);
    x.fillText(s.name,300,s.id?y-18:y);
    if(s.id){x.fillStyle='#A9B1BD';x.font='500 34px '+body;x.fillText(M.T[s.id].mascot+'  ·  '+M.recAt(s.id,g.date).all,300,y+42)}
    if(up)continue;x.textAlign='right';x.fillStyle=lose?'#A9B1BD':'#F4F1E8';x.font='700 190px '+disp;x.fillText(String(s.score),W-90,y+6)}
  if(up){x.textAlign='center';x.fillStyle='#FFB81C';x.font='700 64px '+disp;x.fillText(g.siteUnknown?'VS':'AT',W-190,555);
    x.fillStyle='#F4F1E8';x.font='700 76px '+disp;x.fillText((nice(g.date)+(g.time?'  ·  '+g.time:'')).toUpperCase(),W/2,850);
    x.fillStyle='#A9B1BD';x.font='600 40px '+body;x.fillText(g.siteUnknown?'Site to be confirmed':'at '+h.name,W/2,920)}
  x.strokeStyle='#2A313C';x.lineWidth=3;x.beginPath();x.moveTo(90,555);x.lineTo(W-90,555);x.stroke();
  const sp=g.sponsors.length?g.sponsors.map(v=>(M.B[v.biz]||{}).name).filter(Boolean).join(' & '):'';
  x.textAlign='center';
  if(sp){x.fillStyle='#FFB81C';x.font='600 40px '+body;if(up){x.fillStyle='#0E1116';x.fillRect(60,895,W-120,55);x.fillStyle='#FFB81C'}x.fillText((up&&!g.siteUnknown?'at '+h.name+'  ·  ':'')+'Sponsor: '+sp,W/2,up?920:880)}
  x.fillStyle='#A9B1BD';x.font='500 32px '+body;x.fillText('Local high school scores  ·  '+SITE.replace(/^https:\/\/|\/$/g,''),W/2,985);
  return c;
}
function ShareSheet({M,g,onClose}){
  const[url,setUrl]=useState(null);const blob=useRef(null);
  const h=M.sideOf(g,'home'),a=M.sideOf(g,'away'),up=!hasScore(g),text=up?a.name+(g.siteUnknown?' vs ':' at ')+h.name+', '+nice(g.date)+(g.time?' at '+g.time:'')+'. Follow it on 208 Pressbox':a.name+' '+g.as+', '+h.name+' '+g.hs+' on 208 Pressbox';

/* ---------- Report a score, and apply to be a trusted source ---------- */
const PERIODS=sp=>sp==='vb'?['Set 1','Set 2','Set 3','Set 4','Set 5','Final']:sp==='football'?['1st Qtr','2nd Qtr','Halftime','3rd Qtr','4th Qtr','Final','Final/OT']:/soc$/.test(sp)?['1st Half','Halftime','2nd Half','Final','Final/OT']:['1st Qtr','2nd Qtr','Halftime','3rd Qtr','4th Qtr','Final','Final/OT'];
const ROLES=['Parent','Coach or school staff','Student','Booster club','Media','Fan'];
function ReportSheet({M,g,onClose}){
  const h=M.sideOf(g,'home'),a=M.sideOf(g,'away');
  const[f,setF]=useState({as:g.as??'',hs:g.hs??'',st:'Final',name:myName()});const[done,setDone]=useState(null);const[busy,setBusy]=useState(false);
  const[ap,setAp]=useState({contact:'',team:g.home||g.away||M.S.teams[0].id,role:ROLES[0],note:''});
  const good=f.as!==''&&f.hs!==''&&f.name.trim();
  const send=async()=>{if(!good||busy)return;setBusy(true);const as=+f.as,hs=+f.hs,name=f.name.trim().slice(0,40);
    try{await dbReady;ls.set('pb_name',name);const tr=DB.me.trusted;
      await DB.add('reports',{game:g.id,label:a.name+' at '+h.name+' · '+dshort(g.date),sport:M.sp.name+(M.level==='v'?'':' '+LV[M.level]),as,hs,st:f.st,name,uid:DB.me.uid,status:tr?'auto':'new',at:DB.stamp()});
      if(tr)await DB.set('state','live',{[g.id]:{as,hs,st:f.st,by:name,at:Date.now()}},true);
      const old=tr?null:await DB.get('applications',DB.me.uid).catch(()=>null);
      setDone({tr,applied:old?old.status:null});
    }catch(e){console.warn(e);SAY('Could not send that. Check your connection and try again.')}setBusy(false)};
  const apply=async()=>{if(!ap.contact.trim()||busy)return;setBusy(true);
    try{await DB.set('applications',DB.me.uid,{name:f.name.trim().slice(0,40),contact:ap.contact.trim().slice(0,80),team:ap.team,role:ap.role,note:ap.note.trim().slice(0,300),uid:DB.me.uid,status:'new',at:DB.stamp()});setDone({...done,applied:'new'})}
    catch(e){console.warn(e);SAY('Could not send that. Try again.')}setBusy(false)};
  const num=k=>html`<input class="in sc" style="width:76px;font-size:26px" inputmode="numeric" id=${'rp-'+k} aria-label=${(k==='as'?a.name:h.name)+' score'} value=${f[k]} onInput=${e=>setF({...f,[k]:e.target.value.replace(/[^0-9]/g,'').slice(0,3)})}/>`;
  if(done)return html`<${Sheet} title="Score sent" onClose=${onClose}>
    <div class="card"><b>${a.name} ${f.as}, ${h.name} ${f.hs} · ${f.st}</b><div class="note">${done.tr?'You are a trusted source, so this is showing for everyone now.':'Thanks. 208 Pressbox checks it before it shows for everyone.'}</div></div>
    ${done.tr?null:done.applied==='new'?html`<div class="note">Your trusted source application is waiting for approval.</div>`
    :done.applied==='no'?null
    :html`<h3 class="eyebrow">Be a trusted source</h3><div class="note">Trusted sources post scores straight to the app, live from the game. Tell us who you are and 208 Pressbox will get back to you.</div>
      <div class="formrow"><label class="field">Phone or email<input id="ap-contact" value=${ap.contact} onInput=${e=>setAp({...ap,contact:e.target.value})}/></label>
        <label class="field">Team you follow<select id="ap-team" value=${ap.team} onChange=${e=>setAp({...ap,team:e.target.value})}>${M.S.teams.map(t=>html`<option value=${t.id}>${t.name}</option>`)}</select></label>
        <label class="field">You are a<select id="ap-role" value=${ap.role} onChange=${e=>setAp({...ap,role:e.target.value})}>${ROLES.map(r=>html`<option value=${r}>${r}</option>`)}</select></label></div>
      <label class="field">Anything else (optional)<input id="ap-note" value=${ap.note} onInput=${e=>setAp({...ap,note:e.target.value})} placeholder="Which games you are usually at"/></label>
      <div class="row"><button class="btn pri" disabled=${!ap.contact.trim()||busy} onClick=${apply}>Apply</button><span class="note">Only the 208 Pressbox admin sees your contact info.</span></div>`}
    <div><button class="btn" onClick=${onClose}>Done</button></div><//>`;
  return html`<${Sheet} title="Report score" onClose=${onClose}>
    <div class="list"><div class="li"><${Logo} id=${a.id} name=${a.name} size=${40}/><span class="grow"><b>${a.name}</b></span>${num('as')}</div>
      <div class="li"><${Logo} id=${h.id} name=${h.name} size=${40}/><span class="grow"><b>${h.name}</b></span>${num('hs')}</div></div>
    <div class="formrow"><label class="field">Where the game stands<select id="rp-st" value=${f.st} onChange=${e=>setF({...f,st:e.target.value})}>${PERIODS(M.sport).map(p=>html`<option value=${p}>${p}</option>`)}</select></label>
      <label class="field">Your name<input id="rp-name" value=${f.name} onInput=${e=>setF({...f,name:e.target.value})}/></label></div>
    <div class="row"><button class="btn pri" disabled=${!good||busy} onClick=${send}>${busy?'Sending…':'Send score'}</button></div>
    <div class="note">Report only what is on the scoreboard. Scores from trusted sources show right away; everyone else's are checked first.</div><//>`;

async function scoreWeek(S,sport,w){
  const wid=sport+':'+mondayOf(w.first),picks=await DB.list('picks',[['week','==',wid]]),G={},U={};w.games.forEach(g=>G[g.id]=g);
  picks.forEach(p=>{const g=G[p.game];if(!g)return;const u=U[p.uid]=U[p.uid]||{uid:p.uid,name:p.name||'Fan',right:0,of:0};if(p.name)u.name=p.name;
    if((p.at||0)>kickoff(g)+60000||!played(g)||g.hs===g.as)return;u.of++;if((g.hs>g.as?'home':'away')===p.pick)u.right++});
  const by=(a,b)=>b.right-a.right||a.of-b.of||a.name.localeCompare(b.name),rows=Object.values(U).sort(by);
  const done=w.games.filter(played).length,final=done===w.games.length&&rows.length>0,top=rows.length?rows[0].right:0;
  await DB.set('boards',wid,{sport,week:wid,label:w.label,rows:rows.slice(0,300),players:rows.length,done,games:w.games.length,final,winners:final?rows.filter(r=>r.right===top).map(r=>r.name):[],at:Date.now()});
  const T={};(await DB.list('boards',[['sport','==',sport]])).filter(b=>b.week).forEach(b=>b.rows.forEach(r=>{const t=T[r.uid]=T[r.uid]||{uid:r.uid,name:r.name,right:0,of:0};t.name=r.name;t.right+=r.right;t.of+=r.of}));
  await DB.set('boards',sport+':season',{sport,rows:Object.values(T).sort(by).slice(0,300),at:Date.now()});
  return{players:rows.length,final};
}

function Poll({M,poll}){
  const day=todayISO(),[counts,setCounts]=useState(poll.result||null),[voted,setVoted]=useState(null);
  const load=()=>dbReady.then(async()=>{const v=await DB.get('votes',poll.id+'__'+DB.me.uid+'__'+day);setVoted(v?v.nom:'');
    if(!poll.result){const c={};await Promise.all(poll.noms.map(async n=>{c[n.id]=await DB.count('votes',[['poll','==',poll.id],['nom','==',n.id]])}));setCounts(c)}}).catch(e=>{console.warn(e);setVoted('')});
  useEffect(()=>{load()},[poll.id]);
  const vote=async n=>{if(voted||!poll.open)return;setVoted(n.id);try{await DB.set('votes',poll.id+'__'+DB.me.uid+'__'+day,{poll:poll.id,nom:n.id,uid:DB.me.uid,day,at:DB.stamp()});load()}catch(e){console.warn(e);setVoted('');SAY('Vote not counted. Check your connection.')}};
  const tot=counts?Object.values(counts).reduce((a,b)=>a+b,0):0,show=counts&&(voted||!poll.open),best=counts?Math.max(0,...Object.values(counts)):0;
  return html`<div class="between"><h2 class="eyebrow">${poll.title}</h2><button class="link" onClick=${()=>shareLink(poll.title,'Vote for '+poll.title+' on 208 Pressbox',SITE+'#vote')}>Share</button></div>
    <div class="list">${poll.noms.map(n=>{const c=(counts||{})[n.id]||0,pct=tot?Math.round(100*c/tot):0,win=!poll.open&&tot>0&&c===best;
      return html`<div class="li" style="flex-wrap:wrap"><${Logo} id=${n.team} name=${n.name} size=${40}/><span class="grow"><b>${n.name}</b>${win?html` <span class="tag" style="color:var(--accent);border-color:var(--accent)">Winner</span>`:null}<div class="sub">${(M.T[n.team]||{}).name||''}${n.line?' · '+n.line:''}</div></span>
        ${show?html`<span class="pill">${pct}%</span>`:poll.open&&voted===''?html`<button class="btn sm pri" onClick=${()=>vote(n)}>Vote</button>`:null}
        ${show?html`<div class="bar"><i style=${'width:'+pct+'%'+(voted===n.id||win?'':';background:var(--dash)')}></i></div>`:null}</div>`})}</div>
    <div class="note">${!poll.open?'Voting is closed. '+tot+(tot===1?' vote.':' votes.'):voted?'Your vote is in for today. Come back tomorrow to vote again. '+tot+(tot===1?' vote':' votes')+' so far.':'One vote per day until voting closes.'}</div>`;
}

async function shrink(file,max,q,cap){
  const url=URL.createObjectURL(file),im=await loadImg(url);URL.revokeObjectURL(url);if(!im)throw new Error('not a picture');
  const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  let out=c.toDataURL('image/jpeg',q);while(out.length>cap&&q>.3){q-=.1;out=c.toDataURL('image/jpeg',q)}
  if(out.length>cap)throw new Error('too large');return{src:out,w:c.width,h:c.height};
}

const BSHORT={'Idaho Falls':'Id. Falls','Thunder Ridge':'Thunder R.','Canyon Ridge':'Canyon R.'};   // brackets are narrow on a phone
function Bracket({M,b,go}){

  const base=catsFor(M,sp0),missing=(sp0==='football'?CATS.concat(base.filter(c=>!CATS.some(x=>x[0]===c[0]))):base).filter(c=>!st[c[0]]);
  return html`<div class="formrow"><label class="field">Team<select id="st-team" value=${tid} onChange=${e=>setTid(e.target.value)}>${S.teams.map(x=>html`<option value=${x.id}>${x.name}</option>`)}</select></label><label class="field">Sport<select id="st-sport" value=${sp0} onChange=${e=>{setSp(e.target.value);setLv('v')}}>${S.sports.map(x=>html`<option value=${x.id}>${x.name}</option>`)}</select></label>
    <label class="field">Level<select id="st-level" value=${lv} onChange=${e=>setLv(e.target.value)}>${lvs.map(k=>html`<option value=${k}>${LV[k]}</option>`)}</select></label></div>

  ${cats.map(c=>html`<h2 class="eyebrow" style="margin-top:8px">${c[1]}${c[2]?' · '+c[2]:''}</h2>

    <div><button class="btn sm" onClick=${()=>mut(o=>{o[c[0]].push({name:'New player',v:0})})}>Add a player to ${c[1]}</button></div>`)}
  ${cats.length?null:html`<div class="slot"><strong>No stats for this team and sport yet</strong><span>Add a category below, then add players to it.</span></div>`}
  <h2 class="eyebrow" style="margin-top:12px">Add a category</h2>
  ${missing.length?html`<div class="chips">${missing.map(c=>html`<button class="chip" onClick=${()=>mut(o=>{o[c[0]]=[{name:'New player',v:0}]})}>${c[1]}</button>`)}</div>`:null}
  ${html`<div class="formrow"><label class="field">Category name<input id="st-newcat" value=${nc} onInput=${e=>setNc(e.target.value)} placeholder="Points per game"/></label><button class="btn" disabled=${!nc.trim()||!!st[nc.trim()]} onClick=${()=>{const k=nc.trim().replace(/[.\/|]/g,' ');mut(o=>{o[k]=[{name:'New player',v:0}]});setNc('')}}>Add category</button></div>`}
  ${changed?html`<div><button class="btn" onClick=${()=>update(s=>{const T=s.teams.find(x=>x.id===tid);T.stats=T.stats||{};T.stats[sp]=clone(seedS)})}>Undo all my changes to these stats</button></div>`:null}`;
}

function migrateOld(){ // carry over edits made before the shared database existed
  try{const ks=Object.keys(localStorage).filter(k=>k.indexOf('pb_preview3_')===0).sort();if(!ks.length)return{};
    const o=JSON.parse(localStorage.getItem(ks[ks.length-1])),sg={},st={},J=JSON.stringify,p={scores:{},sponsors:{},favBiz:{},rosters:{},businesses:o.businesses||[]};
    SEED.games.forEach(g=>sg[g.id]=g);SEED.teams.forEach(t=>st[t.id]=t);
    (o.games||[]).forEach(g=>{const x=sg[g.id];if(!x)return;if(x.hs==null&&g.hs!=null&&g.as!=null)p.scores[g.id]=[g.as,g.hs];if((g.sponsors||[]).length)p.sponsors[g.id]={mode:g.sponsorMode,list:g.sponsors}});
    (o.teams||[]).forEach(t=>{const x=st[t.id];if(!x)return;if((t.favBiz||[]).length)p.favBiz[t.id]=t.favBiz;
      Object.keys(t.rosters||{}).forEach(sp=>Object.keys(t.rosters[sp]).forEach(lv=>{const r=t.rosters[sp][lv];if(r&&r.length&&J(r)!==J((x.rosters[sp]||{})[lv]||[]))p.rosters[t.id+'|'+sp+'|'+lv]=r}))});
    return p}catch(e){return{}}
}
function App(){
  const[patch,setPatchRaw]=useState(()=>ls.json('pb_patch')||migrateOld());const[live,setLive]=useState(null);

  const[sheet,setSheet]=useState(null);const[level,setLevel]=useState('v');const[sport,setSportRaw]=useState(()=>{const h=loadHidden(),f=SEED.sports.find(x=>x.on&&!h.includes(x.id));return f?f.id:'football'});
  const pref=useRef(patch),saveT=useRef(null),toastT=useRef(null);
  const[picks,setPicks]=useState({});const[hidden,setHidden]=useState(loadHidden);
  const toggleSport=id=>setHidden(h=>{const n=h.includes(id)?h.filter(x=>x!==id):h.concat(id);ls.set('pb_hide_sports',JSON.stringify(n));return n});
  useEffect(()=>{PICKED=(g,k)=>setPicks(p=>({...p,[g]:k}));if(COMMUNITY)dbReady.then(()=>DB.list('picks',[['uid','==',DB.me.uid]])).then(r=>{const o={};r.forEach(x=>{if(x.pick)o[x.game]=x.pick});setPicks(p=>({...o,...p}))}).catch(()=>{});
    if(!ls.get('pb_guide')&&location.hash!=='#admin'){ls.set('pb_guide','1');setSheet({k:'guide'})}},[]);
  const[adm,setAdm]=useState(SHOW_ADMIN);useEffect(()=>{const h=()=>{if(location.hash==='#admin')setAdm(true)};window.addEventListener('hashchange',h);return()=>window.removeEventListener('hashchange',h)},[]);
  const setPatch=p=>{pref.current=p;setPatchRaw(p);ls.set('pb_patch',JSON.stringify(p))};
  const S=useMemo(()=>applyPatch(SEED,patch,live),[patch,live]);
  useEffect(()=>{SAY=m=>{setToast(m);clearTimeout(toastT.current);toastT.current=setTimeout(()=>setToast(''),4200)};const off=[];
    dbReady.then(()=>{setMe({...DB.me});off.push(DB.watch('state','admin',d=>{if(d&&!saveT.current)setPatch(d)}));off.push(DB.watch('state','live',d=>setLive(d||{})))});countVisit();
    const h=()=>{if(document.visibilityState!=='hidden')return;flushTrack();if(saveT.current){clearTimeout(saveT.current);saveT.current=null;DB.set('state','admin',pref.current).catch(()=>{})}};document.addEventListener('visibilitychange',h);
    return()=>{off.forEach(f=>f&&f());document.removeEventListener('visibilitychange',h)}},[]);
  useEffect(()=>{document.documentElement.setAttribute('data-look',S.look||'board')},[S.look]);
  const setSport=id=>{setSportRaw(id);const sp=S.sports.find(x=>x.id===id);if(sp&&!(sp.levels||['v']).includes(level))setLevel('v')};
  const M=useMemo(()=>{const m=model(S,sport,level);m.picks=picks;m.hidden=hidden;return m},[S,sport,level,picks,hidden]);
  const update=fn=>{const n=applyPatch(SEED,pref.current,null);fn(n);const p=derivePatch(n);setPatch(p);
    clearTimeout(saveT.current);saveT.current=setTimeout(()=>{saveT.current=null;dbReady.then(()=>DB.set('state','admin',pref.current)).catch(e=>{console.warn(e);SAY('That change did not save for everyone. Check your connection.')})},700)};
  const reset=()=>{setPatch({});dbReady.then(()=>DB.set('state','admin',{})).catch(()=>{})};
  const toggle=id=>setFavs(f=>{const n=f.includes(id)?f.filter(x=>x!==id):f.concat(id);ls.set(FAVKEY,JSON.stringify(n));return n});
  const go=v=>{setView(v);try{window.scrollTo(0,0)}catch(e){}};
  const openGame=g=>setSheet({k:'game',id:g.id}),close=()=>setSheet(null),bump=()=>setVer(v=>v+1);
  const sg=sheet&&sheet.id?S.games.find(g=>g.id===sheet.id):null,MG=sg?(sg.sport===sport&&(sg.level||'v')===level?M:Object.assign(model(S,sg.sport||'football',sg.level||'v'),{picks})):M;
  return html`<div class="wrap">
    <header class="hdr"><button class="brand" onClick=${()=>go({v:'home'})} aria-label="208 Pressbox home"><img src=${BRAND.icon} alt=""/><b>208</b><span>PRESSBOX</span></button>
      <div class="hdr-btns"><button class="icon" aria-label="Search" onClick=${()=>setSheet({k:'search'})}>${Ico.search}</button>${adm?html`<button class="icon" aria-label="Admin" onClick=${()=>go({v:'admin'})}>${Ico.gear}</button>`:null}</div></header>
    ${view.v==='home'?html`<${Home} M=${M} favs=${favs} go=${go} tab=${homeTab} setTab=${setHomeTab} openGame=${openGame} openFavs=${()=>setSheet({k:'favs'})} level=${level} setLevel=${setLevel} setSport=${setSport} openSheet=${setSheet} ver=${ver}/>`:null}
    ${view.v==='team'&&M.T[view.id]?html`<${TeamPage} M=${M} id=${view.id} tab=${view.tab||'schedule'} setTab=${t=>setView({...view,tab:t})} favs=${favs} toggle=${toggle} go=${go} openGame=${openGame} openDonate=${t=>setSheet({k:'donate',id:t.id})} level=${level} setLevel=${setLevel} setSport=${setSport} openSheet=${setSheet} ver=${ver}/>`:null}

    ${view.v==='home'?html`<div class="note" style="padding-top:8px"><button class="link" style="min-height:44px;font-size:13px" onClick=${()=>setSheet({k:'install'})}>Add 208 Pressbox to your home screen</button> · <button class="link" style="min-height:44px;font-size:13px" onClick=${()=>setSheet({k:'guide',start:2})}>How it works</button></div>`:null}

    ${sheet&&sheet.k==='photo'?html`<${PhotoSheet} M=${M} p=${sheet.p} onClose=${close} onDone=${bump}/>`:null}
    ${sheet&&sheet.k==='favs'?html`<${FavSheet} M=${M} favs=${favs} toggle=${toggle} toggleSport=${toggleSport} onClose=${close}/>`:null}
    ${sheet&&sheet.k==='search'?html`<${SearchSheet} M=${M} go=${go} setSport=${setSport} setLevel=${setLevel} onClose=${close}/>`:null}
    ${sheet&&sheet.k==='donate'?html`<${DonateSheet} t=${M.T[sheet.id]} onClose=${close}/>`:null}
    ${view.v!=='admin'?html`<${BottomBar} tab=${view.v==='home'?homeTab:''} pick=${k=>{setHomeTab(k);go({v:'home'})}}/>`:null}
    ${toast?html`<div class="toast" role="status">${toast}</div>`:null}
  </div>`;
}
render(html`<${App}/>`,document.getElementById('app'));
</script>
