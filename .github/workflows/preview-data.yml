name: Preview data
# Test branch only: pulls MaxPreps with the settings on this branch so new sports can be previewed before going live.
on:
  push:
    branches: [fan-features-wip]
    paths: ["source/config.json", "source/updater/**", ".github/workflows/preview-data.yml"]
permissions:
  contents: write
concurrency:
  group: preview-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 source/updater/update.py --force > source/updater/preview-run.txt 2>&1 || true
      - run: |
          git config user.name "208 Pressbox updater"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Preview data pull" || exit 0
          git pull --rebase -q origin fan-features-wip
          git push
