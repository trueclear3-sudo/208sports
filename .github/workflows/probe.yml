name: Probe
on:
  push:
    branches: [probe]
    paths: ["source/updater/probe.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 source/updater/probe.py > source/updater/probe-results.txt 2>&1 || true
      - run: |
          git config user.name "208 Pressbox updater"
          git config user.email "actions@users.noreply.github.com"
          git add source/updater/probe-results.txt
          git commit -m "Probe results"
          git push
