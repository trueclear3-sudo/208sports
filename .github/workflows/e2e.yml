name: Database test
# Test branch only: opens the built app in a real browser and checks it against the Firebase project.
on:
  push:
    branches: [fan-features-wip]
    paths: ["source/e2e/**", "source/firebase.json", ".github/workflows/e2e.yml"]
permissions:
  contents: write
concurrency:
  group: preview-data
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null
      - run: cd source && python3 build.py && python3 e2e/test.py > e2e/result.txt 2>&1 || true
      - run: |
          git config user.name "208 Pressbox updater"
          git config user.email "actions@users.noreply.github.com"
          git add source/e2e/result.txt
          git commit -m "Database test result" || exit 0
          git pull --rebase -q origin fan-features-wip
          git push
