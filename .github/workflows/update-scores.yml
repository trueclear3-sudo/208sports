name: Update scores
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["source/updater/**", ".github/workflows/update-scores.yml"]
permissions:
  contents: write
concurrency:
  group: update-scores
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe MaxPreps
        run: python3 source/updater/probe.py
      - name: Save results
        run: |
          git config user.name "208 Pressbox updater"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Updater probe results"
          git push
