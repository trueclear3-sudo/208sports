name: Game night
# Every 5 minutes on afternoons and evenings (Mountain time): re-read MaxPreps for games that should be over
# (every other run, so MaxPreps is not hit too often), publish new scores, then send phone score alerts.
# Times are UTC: 20:00 UTC is 2 PM Mountain in fall. GitHub can start scheduled runs a few minutes late.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 20-23 * * *"
    - cron: "*/5 0-6 * * *"
permissions:
  contents: write
concurrency:
  group: update-scores
  cancel-in-progress: false
jobs:
  tonight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the alert libraries
        run: pip install -q cryptography requests google-auth
      - name: Check MaxPreps for games that should be over
        run: |
          if [ $(( 10#$(date -u +%M) / 5 % 2 )) -eq 0 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 source/updater/update.py --tonight
          else
            echo "Skipping MaxPreps this run."
          fi
      - name: Publish if anything changed
        run: |
          git config user.name "208 Pressbox updater"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to publish."; exit 0; fi
          git commit -qm "Game night scores: $(sed -n 2p source/updater/last-run.txt)"
          for i in 1 2 3; do
            if git pull --rebase -q origin main && git push -q; then echo "Published."; exit 0; fi
            echo "Someone else published first. Redoing on top of the newest copy."
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            python3 source/updater/update.py --tonight || true
            git add -A
            if git diff --cached --quiet; then exit 0; fi
            git commit -qm "Game night scores"
          done
          exit 1
      - name: Send score alerts
        if: always()
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python3 source/notify/notify.py
