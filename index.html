<style>
/* Layout: one phone-width column that widens into a card grid on desktop. Palette is David's 208 Pressbox design; headings, tabs and scores are set in chalk lettering. */
:root{
  color-scheme:dark;
  --bg:#0E1116; --card:#171C24; --line:#2A313C; --dash:#4A5361;

*{box-sizing:border-box}

.brand span,.brand b{filter:url(#chalkfx)}

.pill{font-size:19px}
.tab{font-size:18px}
.score{font-size:32px}
.num{font-size:22px}

[data-look=score]{--bg:#0A0A0B;--card:#0A0A0B;--line:#33312D;--dash:#5A574F;--fg:#F5F2E9;--muted:#9A968C;--chalk:#F5F2E9;--disp:Anton,'Arial Narrow',sans-serif;--body:'Barlow Condensed','Arial Narrow',sans-serif}

/* Phones keep an old copy of the page for a while. Check for a newer version when the app opens or comes back
   to the screen, and reload once if there is one. */
function checkVersion(){if(!BUILD||PREVIEW)return;fetch('version.txt?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(v=>{v=(v||'').trim();
  if(v&&v!==BUILD&&ls.get('pb_reloaded')!==v){ls.set('pb_reloaded',v);location.reload()}}).catch(()=>{})}
checkVersion();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkVersion()});

const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},json:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}};
function loadFavs(){const s=ls.json(FAVKEY);return Array.isArray(s)?s:[]}

/* ---------- Shared database ----------
   One small interface with two engines behind it. With a Firebase config the app talks to Firestore, so every phone
   sees the same thing. Without one it keeps everything in this browser (the old behavior, and what the preview uses).
   Collections: state/admin (the owner's edits), state/live (scores from trusted sources), reports, applications,
   trusted, picks, boards, votes, photos + photoFull, flags, visits, stats. */
const deepMerge=(a,b)=>{const o={...a};Object.keys(b).forEach(k=>{o[k]=b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a&&a[k]&&typeof a[k]==='object'?deepMerge(a[k],b[k]):b[k]});return o};
const deepAdd=(a,b)=>{const o={...(a||{})};Object.keys(b).forEach(k=>{o[k]=typeof b[k]==='number'?(o[k]||0)+b[k]:deepAdd(o[k],b[k])});return o};

  const col=c=>mem[c]=mem[c]||{},subs=[];
  const ok=(d,w)=>(w||[]).every(([f,op,v])=>op==='=='?d[f]===v:true);
  const me={uid,admin:true,trusted:!!col('trusted')[uid],email:''};

    if(lv&&g.hs==null&&!sc&&(/^Final/.test(lv.st)||Date.now()-lv.at<6*3600e3)){g.as=lv.as;g.hs=lv.hs;g.live=lv;if(!/^Final/.test(lv.st))g.inprog=true;else if(/OT/.test(lv.st))g.note='OT'}

const barOfTeamTab=t=>({scores:'scores',schedule:'schedule',standings:'standings',picks:'picks'})[t]||'players';
function BottomBar({tab,pick}){

function Levels({level,setLevel,M}){

function Sheet({title,onClose,children}){

function pickNote(M,g){const k=(M.picks||{})[g.id];if(!k)return null;const nm=M.sideOf(g,k).name;
  if(played(g)&&g.hs!==g.as){const ok=(g.hs>g.as?'home':'away')===k;return html`<span style=${'color:var(--'+(ok?'good':'bad')+')'}>You picked ${nm} · ${ok?'right':'missed'}</span>`}
  return html`<span style="color:var(--accent)">Your pick: ${nm}</span>`}
function GameRow({M,g,open}){   // one compact line per game, used on the Schedule screen
  const h=M.sideOf(g,'home'),a=M.sideOf(g,'away'),pl=played(g),sc=hasScore(g),pk=pickNote(M,g);
  const side=(s,o)=>html`<div class=${'gr'+(pl&&s.score<o.score?' lose':'')}><${Logo} id=${s.id} name=${s.name} size=${22}/><span class="nm">${s.name}</span>${sc?html`<b>${s.score}</b>`:null}</div>`;
  return html`<button class="li" onClick=${()=>open(g)} aria-label=${a.name+' at '+h.name}><span class="gd"><b>${dshort(g.date)}</b><span>${g.inprog?'LIVE · '+g.live.st:pl?(NOTE[g.note]||'FINAL'):g.date<todayISO()?'NO SCORE':(g.time||'TBD')}</span></span>

function GameCard({M,g,go,open}){
  const h=M.sideOf(g,'home'),a=M.sideOf(g,'away'),st=status(g),pl=played(g),sp=sponsorLine(M,g);
  const first=[a,h];if(sp)g.sponsors.forEach(x=>track('sponsorSeen',x.biz,true));

  return html`<button class="card" onClick=${()=>open(g)} aria-label=${a.name+' at '+h.name}>
    <div class="meta"><span>${M.level==='v'?'':LV[M.level]+' '}${M.sp.name}${M.isConf(g)?' · Conf':''}</span><span class=${st.live?'live':st.up?'up':''}>${st.t}</span></div>
    ${rowOf(first[0],first[1])}${rowOf(first[1],first[0])}
    <div class="spon">${sp||html`${g.siteUnknown?'Site to confirm':'at '+h.name} · Matchup sponsor open`}${pickNote(M,g)?html`<div style="font-weight:600;padding-top:4px">${pickNote(M,g)}</div>`:null}</div>
  </button>`;
}
function GameSheet({M,g,go,onClose,openSheet}){
  const h=M.sideOf(g,'home'),a=M.sideOf(g,'away'),st=status(g),pl=played(g),sp=sponsorLine(M,g),rc=recap(M,g);

  <//>`;

  <section class="sec" aria-label="Sport and level"><${Sports} M=${M} setSport=${setSport} edit=${openFavs}/>${tab==='picks'?null:html`<${Levels} level=${level} setLevel=${setLevel} M=${M}/>`}</section>
  ${tab==='scores'&&poll&&poll.open?html`<button class="banner between" style="width:100%;text-align:left;margin-bottom:14px;color:var(--fg)" onClick=${()=>setTab('players')}><span><b>Vote: ${poll.title}</b><br/>${poll.noms.length} nominees. One vote a day.</span><span class="btn sm pri">Vote</span></button>`:null}
  ${tab==='scores'?html`

/* ---------- Recaps: written from the scores only, so nothing is made up ---------- */
const MARGIN={football:[3,8,28],bsoc:[1,1,4],gsoc:[1,1,4]};
function recap(M,g){
  const own=(M.S.recaps||{})[g.id];if(own)return{text:own,auto:false};
  if(!played(g))return null;
  const h=M.sideOf(g,'home'),a=M.sideOf(g,'away');
  if(g.hs===g.as)return{text:a.name+' and '+h.name+' finished tied '+g.as+'-'+g.hs+'.',auto:true};
  const w=g.hs>g.as?h:a,l=w===h?a:h,d=w.score-l.score,m=MARGIN[M.sport]||[3,8,25];
  const verb=g.note==='FF'?'won by forfeit over':M.vb?(l.score===0?'swept':d===1?'outlasted':'beat'):l.score===0&&M.fb?'shut out':d<=m[0]?'edged':d<=m[1]?'held off':d>=m[2]?'rolled past':'beat';
  let t=w.name+' '+verb+' '+l.name+' '+w.score+'-'+l.score+(g.siteUnknown||g.note==='FF'?'':w===a?' on the road':' at home')+(g.note==='OT'?' in overtime':'')+'.';
  if(w.id){const r=M.recAt(w.id,g.date);t+=' '+w.name+' moved to '+r.all+(r.run>=3?' with '+r.run+' wins in a row':'')+'.'}
  if(l.id){const r=M.recAt(l.id,g.date);t+=' '+l.name+' fell to '+r.all+(r.run<=-3?', '+(-r.run)+' losses in a row':'')+'.'}
  [w,l].forEach(s=>{if(!s.id)return;const gs=M.gamesOf(s.id),later=gs.filter(x=>x.date>g.date);if(later.some(played))return;const nx=later[0];if(!nx)return;
    const o=M.sideOf(nx,nx.home===s.id?'away':'home');t+=' Next for '+s.name+': '+nice(nx.date)+(nx.home===s.id?' vs ':' at ')+o.name+'.'});
  return{text:t,auto:true};
}

/* ---------- Share a score as a picture ---------- */
const loadImg=src=>new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src});
async function scoreCard(M,g){
  const W=1080,c=document.createElement('canvas');c.width=c.height=W;const x=c.getContext('2d');
  try{await Promise.all([document.fonts.load('700 120px "Cabin Sketch"'),document.fonts.load('600 60px Barlow')])}catch(e){}
  const disp='"Cabin Sketch","Chalkboard SE",sans-serif',body='Barlow,system-ui,sans-serif';
  x.fillStyle='#0E1116';x.fillRect(0,0,W,W);
  for(let i=0;i<1400;i++){x.fillStyle='rgba(244,241,232,'+(Math.random()*.045).toFixed(3)+')';x.fillRect(Math.random()*W,Math.random()*W,2+Math.random()*26,1+Math.random()*2)}
  x.strokeStyle='#4A5361';x.lineWidth=5;x.strokeRect(36,36,W-72,W-72);
  x.textBaseline='middle';x.textAlign='left';x.font='700 92px '+disp;
  const w1=x.measureText('208 ').width,w2=x.measureText('PRESSBOX').width,x0=(W-w1-w2)/2;
  x.fillStyle='#FFB81C';x.fillText('208 ',x0,150);x.fillStyle='#F4F1E8';x.fillText('PRESSBOX',x0+w1,150);
  const h=M.sideOf(g,'home'),a=M.sideOf(g,'away'),st=status(g),up=!hasScore(g);
  x.textAlign='center';x.fillStyle='#A9B1BD';x.font='600 38px '+body;
  x.fillText(((M.level==='v'?'':LV[M.level]+' ')+M.sp.name+'  ·  '+(up?(g.conf?'Conference game':g.post?'Playoffs':'Game day'):st.t)).toUpperCase(),W/2,250);
  const rows=[a,h];
  for(let i=0;i<2;i++){const s=rows[i],o=rows[1-i],y=430+i*250,lose=!up&&s.score<o.score;
    x.beginPath();x.arc(170,y,92,0,7);x.fillStyle=s.id&&LOGO[s.id]?'#fff':'#2A313C';x.fill();
    const im=s.id&&LOGO[s.id]?await loadImg(LOGO[s.id]):null;
    if(im){const k=Math.min(124/im.width,124/im.height);x.save();x.beginPath();x.arc(170,y,90,0,7);x.clip();x.drawImage(im,170-im.width*k/2,y-im.height*k/2,im.width*k,im.height*k);x.restore()}
    else{x.fillStyle='#A9B1BD';x.font='700 64px '+disp;x.textAlign='center';x.fillText(s.name.replace(/[^A-Za-z ]/g,'').split(' ').map(v=>v[0]).join('').slice(0,2).toUpperCase(),170,y)}
    x.textAlign='left';x.fillStyle=lose?'#A9B1BD':'#F2F4F7';let fs=70;do{x.font=(lose?'500 ':'600 ')+fs+'px '+body;fs-=4}while(x.measureText(s.name).width>500&&fs>30);
    x.fillText(s.name,300,s.id?y-18:y);
    if(s.id){x.fillStyle='#A9B1BD';x.font='500 34px '+body;x.fillText(M.T[s.id].mascot+'  ·  '+M.recAt(s.id,g.date).all,300,y+42)}
    if(up)continue;x.textAlign='right';x.fillStyle=lose?'#A9B1BD':'#F4F1E8';x.font='700 190px '+disp;x.fillText(String(s.score),W-90,y+6)}
  if(up){x.textAlign='center';x.fillStyle='#FFB81C';x.font='700 64px '+disp;x.fillText(g.siteUnknown?'VS':'AT',W-190,555);
    x.fillStyle='#F4F1E8';x.font='700 76px '+disp;x.fillText((nice(g.date)+(g.time?'  ·  '+g.time:'')).toUpperCase(),W/2,850);
    x.fillStyle='#A9B1BD';x.font='600 40px '+body;x.fillText(g.siteUnknown?'Site to be confirmed':'at '+h.name,W/2,920)}
  x.strokeStyle='#2A313C';x.lineWidth=3;x.beginPath();x.moveTo(90,555);x.lineTo(W-90,555);x.stroke();
  const sp=g.sponsors.length?g.sponsors.map(v=>(M.B[v.biz]||{}).name).filter(Boolean).join(' & '):'';
  x.textAlign='center';
  if(sp){x.fillStyle='#FFB81C';x.font='600 40px '+body;if(up){x.fillStyle='#0E1116';x.fillRect(60,895,W-120,55);x.fillStyle='#FFB81C'}x.fillText((up&&!g.siteUnknown?'at '+h.name+'  ·  ':'')+'Sponsor: '+sp,W/2,up?920:880)}
  x.fillStyle='#A9B1BD';x.font='500 32px '+body;x.fillText('Local high school scores  ·  '+SITE.replace(/^https:\/\/|\/$/g,''),W/2,985);
  return c;
}
function ShareSheet({M,g,onClose}){
  const[url,setUrl]=useState(null);const blob=useRef(null);
  const h=M.sideOf(g,'home'),a=M.sideOf(g,'away'),up=!hasScore(g),text=up?a.name+(g.siteUnknown?' vs ':' at ')+h.name+', '+nice(g.date)+(g.time?' at '+g.time:'')+'. Follow it on 208 Pressbox':a.name+' '+g.as+', '+h.name+' '+g.hs+' on 208 Pressbox';

const PERIODS=sp=>sp==='vb'?['Set 1','Set 2','Set 3','Set 4','Set 5','Final']:sp==='football'?['1st Qtr','2nd Qtr','Halftime','3rd Qtr','4th Qtr','Final','Final/OT']:/soc$/.test(sp)?['1st Half','Halftime','2nd Half','Final','Final/OT']:['1st Qtr','2nd Qtr','Halftime','3rd Qtr','4th Qtr','Final','Final/OT'];

function ReportSheet({M,g,onClose}){
  const h=M.sideOf(g,'home'),a=M.sideOf(g,'away');
  const[f,setF]=useState({as:g.as??'',hs:g.hs??'',st:'Final',name:myName()});const[done,setDone]=useState(null);const[busy,setBusy]=useState(false);

  const send=async()=>{if(!good||busy)return;setBusy(true);const as=+f.as,hs=+f.hs,name=f.name.trim().slice(0,40);
    try{await dbReady;ls.set('pb_name',name);const tr=DB.me.trusted;
      await DB.add('reports',{game:g.id,label:a.name+' at '+h.name+' · '+dshort(g.date),sport:M.sp.name+(M.level==='v'?'':' '+LV[M.level]),as,hs,st:f.st,name,uid:DB.me.uid,status:tr?'auto':'new',at:DB.stamp()});
      if(tr)await DB.set('state','live',{[g.id]:{as,hs,st:f.st,by:name,at:Date.now()}},true);
      const old=tr?null:await DB.get('applications',DB.me.uid).catch(()=>null);
      setDone({tr,applied:old?old.status:null});
    }catch(e){console.warn(e);SAY('Could not send that. Check your connection and try again.')}setBusy(false)};
  const apply=async()=>{if(!ap.contact.trim()||busy)return;setBusy(true);
    try{await DB.set('applications',DB.me.uid,{name:f.name.trim().slice(0,40),contact:ap.contact.trim().slice(0,80),team:ap.team,role:ap.role,note:ap.note.trim().slice(0,300),uid:DB.me.uid,status:'new',at:DB.stamp()});setDone({...done,applied:'new'})}
    catch(e){console.warn(e);SAY('Could not send that. Try again.')}setBusy(false)};
  const num=k=>html`<input class="in sc" style="width:76px;font-size:26px" inputmode="numeric" id=${'rp-'+k} aria-label=${(k==='as'?a.name:h.name)+' score'} value=${f[k]} onInput=${e=>setF({...f,[k]:e.target.value.replace(/[^0-9]/g,'').slice(0,3)})}/>`;

    <div class="card"><b>${a.name} ${f.as}, ${h.name} ${f.hs} · ${f.st}</b><div class="note">${done.tr?'You are a trusted source, so this is showing for everyone now.':'Thanks. 208 Pressbox checks it before it shows for everyone.'}</div></div>
    ${done.tr?null:done.applied==='new'?html`<div class="note">Your trusted source application is waiting for approval.</div>`
    :done.applied==='no'?null
    :html`<h3 class="eyebrow">Be a trusted source</h3><div class="note">Trusted sources post scores straight to the app, live from the game. Tell us who you are and 208 Pressbox will get back to you.</div>
      <div class="formrow"><label class="field">Phone or email<input id="ap-contact" value=${ap.contact} onInput=${e=>setAp({...ap,contact:e.target.value})}/></label>
        <label class="field">Team you follow<select id="ap-team" value=${ap.team} onChange=${e=>setAp({...ap,team:e.target.value})}>${M.S.teams.map(t=>html`<option value=${t.id}>${t.name}</option>`)}</select></label>
        <label class="field">You are a<select id="ap-role" value=${ap.role} onChange=${e=>setAp({...ap,role:e.target.value})}>${ROLES.map(r=>html`<option value=${r}>${r}</option>`)}</select></label></div>
      <label class="field">Anything else (optional)<input id="ap-note" value=${ap.note} onInput=${e=>setAp({...ap,note:e.target.value})} placeholder="Which games you are usually at"/></label>
      <div class="row"><button class="btn pri" disabled=${!ap.contact.trim()||busy} onClick=${apply}>Apply</button><span class="note">Only the 208 Pressbox admin sees your contact info.</span></div>`}
    <div><button class="btn" onClick=${onClose}>Done</button></div><//>`;
  return html`<${Sheet} title="Report score" onClose=${onClose}>

const bslug=b=>b.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const bwin=x=>x.a.score!=null&&x.b.score!=null&&x.a.score!==x.b.score?(x.a.score>x.b.score?x.a.name:x.b.name):null;
/* Bracket pick'em: pick every game, later rounds fill in from your own earlier picks. Each round is worth double the one before. */
function bracketSlots(b,picks){
  const R=b.rounds,key=(r,i)=>'br:'+bslug(b)+':r'+r+'g'+i,fed=r=>r>0&&R[r-1].games.length===2*R[r].games.length;
  return R.map((rd,r)=>rd.games.map((x,i)=>{const from=k=>{if(!fed(r))return null;const src=R[r-1].games[2*i+k];return bwin(src)||picks[key(r-1,2*i+k)]||null};
    const a=x.a.name||from(0),bb=x.b.name||from(1);return{x,r,i,key:key(r,i),a,b:bb,win:bwin(x),pts:Math.pow(2,r)}}));
}
const BSHORT={'Idaho Falls':'Id. Falls','Thunder Ridge':'Thunder R.','Canyon Ridge':'Canyon R.'};   // brackets are narrow on a phone
function Bracket({M,b,go}){
  const R=b.rounds,linked=i=>i<R.length-1&&R[i].games.length===2*R[i+1].games.length;
  const side=(s,o)=>html`<div class=${'bs'+(s.score!=null&&o.score!=null&&s.score<o.score?' lose':'')}>${s.seed?html`<i>${s.seed}</i>`:null}<span class="nm" title=${s.name||''}>${s.name?(BSHORT[s.name]||s.name):'TBD'}</span>${s.score!=null?html`<b>${s.score}</b>`:null}</div>`;
  const match=x=>{const done=x.a.score!=null&&x.b.score!=null;
    return html`<div class="bm"><div class="bd">${done?'Final · ':''}${x.date?nice(x.date):'Date TBD'}${!done&&x.time?' · '+x.time:''}</div>${side(x.a,x.b)}${side(x.b,x.a)}</div>`};
  const pairs=g=>{const o=[];for(let i=0;i<g.length;i+=2)o.push(g.slice(i,i+2));return o};
  return html`<div class="bk" style=${'grid-template-columns:repeat('+R.length+',minmax(0,1fr))'}>${R.map((r,i)=>html`<div class="br"><div class="bh">${r.name}</div>
    <div class=${'bc'+(i>0&&linked(i-1)?' fed':'')}>${linked(i)?pairs(r.games).map(p=>html`<div class="bp">${p.map(match)}</div>`):r.games.map(match)}</div></div>`)}</div>`;
}
function Playoffs({M,go,openGame,inSchedule}){
  const br=(M.S.brackets||[]).filter(b=>b.sport===M.sport),post=M.G.filter(g=>g.post);

function migrateOld(){ // carry over edits made before the shared database existed
  try{const ks=Object.keys(localStorage).filter(k=>k.indexOf('pb_preview3_')===0).sort();if(!ks.length)return{};
    const o=JSON.parse(localStorage.getItem(ks[ks.length-1])),sg={},st={},J=JSON.stringify,p={scores:{},sponsors:{},favBiz:{},rosters:{},businesses:o.businesses||[]};
    SEED.games.forEach(g=>sg[g.id]=g);SEED.teams.forEach(t=>st[t.id]=t);
    (o.games||[]).forEach(g=>{const x=sg[g.id];if(!x)return;if(x.hs==null&&g.hs!=null&&g.as!=null)p.scores[g.id]=[g.as,g.hs];if((g.sponsors||[]).length)p.sponsors[g.id]={mode:g.sponsorMode,list:g.sponsors}});
    (o.teams||[]).forEach(t=>{const x=st[t.id];if(!x)return;if((t.favBiz||[]).length)p.favBiz[t.id]=t.favBiz;
      Object.keys(t.rosters||{}).forEach(sp=>Object.keys(t.rosters[sp]).forEach(lv=>{const r=t.rosters[sp][lv];if(r&&r.length&&J(r)!==J((x.rosters[sp]||{})[lv]||[]))p.rosters[t.id+'|'+sp+'|'+lv]=r}))});
    return p}catch(e){return{}}
}

    ${sheet&&sheet.k==='report'&&sg?html`<${ReportSheet} M=${MG} g=${sg} onClose=${()=>{close();bump()}}/>`:null}
    ${sheet&&sheet.k==='install'?html`<${InstallSheet} onClose=${close}/>`:null}
    ${sheet&&sheet.k==='guide'?html`<${Welcome} M=${M} favs=${favs} toggle=${toggle} start=${sheet.start} onClose=${close}/>`:null}
    ${sheet&&sheet.k==='upload'?html`<${UploadSheet} M=${M} team=${sheet.team} onClose=${close} onDone=${bump}/>`:null}
    ${sheet&&sheet.k==='photo'?html`<${PhotoSheet} M=${M} p=${sheet.p} onClose=${close} onDone=${bump}/>`:null}
    ${sheet&&sheet.k==='favs'?html`<${FavSheet} M=${M} favs=${favs} toggle=${toggle} toggleSport=${toggleSport} onClose=${close}/>`:null}
    ${sheet&&sheet.k==='search'?html`<${SearchSheet} M=${M} go=${go} setSport=${setSport} setLevel=${setLevel} onClose=${close}/>`:null}
    ${sheet&&sheet.k==='donate'?html`<${DonateSheet} t=${M.T[sheet.id]} onClose=${close}/>`:null}
    ${view.v!=='admin'?html`<${BottomBar} tab=${view.v==='home'?homeTab:view.v==='team'?barOfTeamTab(view.tab||'scores'):''} pick=${k=>{if(view.v==='team'&&k!=='teams'){const f=FAN.includes(k)?'fans':k;setView({...view,tab:TEAMTAB[f]||'scores'});try{window.scrollTo(0,0)}catch(e){}}else{setHomeTab(k);go({v:'home'})}}}/>`:null}
    ${toast?html`<div class="toast" role="status">${toast}</div>`:null}
  </div>`;
}
render(html`<${App}/>`,document.getElementById('app'));
</script>
</body></html>
